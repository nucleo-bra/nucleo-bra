<style>

:root[data-theme="dark"]{--bg:#0a1126;--card:#121b38;--tx:#e8eefc;--mu:#93a1c6;--bd:#222e53;--ac:#5b86ff;--ac2:#4aa3ff;--ok:#2ed47a;--wa:#ffa63d;--er:#ff6b5e;--sh:0 0 0 1px rgba(255,255,255,.03),0 16px 36px -14px rgba(0,0,0,.7)}

.mb{max-width:100%}
}

function clSave(id){const g=k=>$('#'+k).value,mes=g('cl_mes'),valor=parseFloat(g('cl_valor')),pct=parseFloat(g('cl_pct')),div=dvRead();

function clDel(id){const l=CLS().find(x=>x.id==id);if(!l)return;if(clLocked(l)){toast('A comissão deste mês já está fechada. Reabra o fechamento para excluir.');return}

function genParc(nf,n,f,ve){let rest=nf.valor;for(let i=0;i<n;i++){const v=i==n-1?+rest.toFixed(2):+(nf.valor/n).toFixed(2);rest-=v;const x=mk('r','NF '+nf.num+' · '+nf.tipo,nf.cli,f,v,addM(ve,i),null,n>1?`${i+1}/${n}`:'');x.coms=JSON.parse(JSON.stringify(nf.coms||[]));x.nfr=nf.num;put(x)}lg('Gerou '+n+' parcela(s) da NF '+nf.num+' ('+f+')')}

${pend.length>1?`<div class="row" style="margin-top:8px"><label>Receber todas as pendentes em<input type="date" id="rc_all" value="${today}"></label><button onclick="rcAll()">Receber ${pend.length} parcelas (${fmt(sum(pend))})</button></div>`:''}
<label style="margin-top:8px"><input type="checkbox" id="rc_s" checked> Se o valor recebido for menor que a parcela, gerar nova parcela com o saldo (vencimento em +30 dias)</label>`
:`<div class="row"><label>Data do recebimento<input type="date" id="rc_d" value="${today}"></label><label>Valor recebido (R$)<input type="number" step="0.01" id="rc_v" value="${sd.toFixed(2)}" style="width:130px"></label><button class="pri" onclick="rcNew()">Receber</button></div><p class="k">Esta NF ainda não tem parcelas. Ao receber, será criada uma parcela já recebida, vinculada à NF.</p>`;
return `<div class="card" style="border-color:var(--ac)"><h2>💰 Receber NF ${esc(n.num)} — ${fmt(n.valor)} · recebido ${fmt(rc)} · saldo ${fmt(sd)}</h2>${body}<div class="row" style="margin-top:8px"><button onclick="ui.rc='';render()">Fechar</button></div></div>`}
function rcDo(id){const i=S.it.find(x=>x.id==id);if(!i||i.pago)return;const d=$('#rd_'+id).value,v=parseFloat($('#rv_'+id).value);
if(!okd(d)){toast('Informe a data do recebimento.');return}if(!(v>0)){toast('Informe o valor recebido (maior que zero).');return}
i.pago=d;if(Math.abs(v-i.valor)>0.005)i.vp=v;else delete i.vp;let ex='';
const cb=$('#rc_s');if(v<i.valor-0.005&&cb&&cb.checked){const x=mk(i.t,i.desc,i.who,i.forma,+(i.valor-v).toFixed(2),addD(d,30),null,(i.par?i.par+' ':'')+'saldo');['coms','nfr'].forEach(k=>{if(i[k]!==undefined)x[k]=JSON.parse(JSON.stringify(i[k]))});i.valor=v;delete i.vp;put(x);ex=' + saldo '+fmt(x.valor)}
wr(i);lg('Recebeu NF '+i.nfr+' '+(i.par||'')+': '+fmt(vr(i))+' em '+br(d)+ex);toast('Recebimento registrado.','ok');render()}

function rcAll(){const n=S.nf.find(x=>x.id==ui.rc);if(!n)return;const d=$('#rc_all').value;if(!okd(d)){toast('Informe a data do recebimento.');return}
const P=S.it.filter(i=>i.t=='r'&&!i.pago&&i.nfr&&String(i.nfr)==String(n.num));P.forEach(i=>{i.pago=d;delete i.vp;wr(i)});lg('Recebeu '+P.length+' parcela(s) da NF '+n.num+' em '+br(d));toast(P.length+' parcela(s) recebidas.','ok');render()}
function rcNew(){const n=S.nf.find(x=>x.id==ui.rc);if(!n)return;const d=$('#rc_d').value,v=parseFloat($('#rc_v').value);
if(!okd(d)||!(v>0)){toast('Informe a data e um valor maior que zero.');return}if(v>n.valor+0.005){toast('O valor recebido é maior que o valor da NF.');return}
const x=mk('r','NF '+n.num+' · '+n.tipo,n.cli||'','Transferência',+v.toFixed(2),d,d,'');x.coms=JSON.parse(JSON.stringify(n.coms||[]));x.nfr=n.num;put(x);lg('Recebeu NF '+n.num+': '+fmt(v)+' em '+br(d));toast('Recebimento registrado.','ok');render()}
function genCard(){const g=S.nf.find(n=>n.id==ui.gen);return g?`<div class="card"><h2>Gerar parcelas da NF ${esc(g.num)} — ${fmt(g.valor)}</h2><div class="row"><label>Parcelas<input id="g_n" type="number" min="1" max="48" value="1" style="width:70px"></label><label>Forma<select id="g_f">${FORMAS.map(f=>`<option>${f}</option>`).join('')}</select></label><label>1º vencimento<input id="g_e" type="date" value="${addD(today,30)}"></label><button class="pri" onclick="doGen()">Gerar</button><button onclick="ui.gen='';render()">Cancelar</button></div><p class="k">As parcelas herdam o cliente, o vínculo com a NF e os comissionados cadastrados nela.</p></div>`:''}
function doGen(){const n=S.nf.find(x=>x.id==ui.gen),q=parseInt($('#g_n').value)||1;if(!n)return;genParc(n,q,$('#g_f').value,$('#g_e').value||addD(today,30));ui.gen='';render()}

return `<div class="card" style="border-color:var(--ac)"><h2>✏️ Editar lançamento: ${esc(i.desc)} ${i.par}</h2><div class="row">
<label>Descrição<input id="e_d" value="${esc(i.desc)}"></label><label>${R?'Cliente':'Fornecedor'}<input id="e_w" value="${esc(i.who)}"></label>

<label>Valor ${R?'recebido':'pago'} (R$)<input id="e_vp" type="number" step="0.01" value="${i.pago&&i.vp!=null?i.vp:''}" placeholder="igual ao previsto" style="width:120px"></label>
${R?`<label>NF vinculada<input id="e_nf" value="${esc(i.nfr)}" style="width:100px"></label>`:`<label>Pedido<input id="e_pc" value="${esc(i.pc)}" style="width:100px"></label><label>Nº NF<input id="e_nfp" value="${esc(i.nf)}" style="width:100px"></label><label>Transportadora<input id="e_tr" value="${esc(i.transp)}" style="width:110px"></label><label>Frete<select id="e_fr"><option ${i.frete=='CIF'?'selected':''}>CIF</option><option ${i.frete=='FOB'?'selected':''}>FOB</option></select></label>`}
${R?cmEd('e',cm(i)):''}${R?`<label style="flex-basis:100%"><input type="checkbox" id="e_rep"> Aplicar estes comissionados também às parcelas seguintes de <b>${esc(i.who)}</b> <span class="k">(só comissionados e %; valor, data e baixa das outras parcelas não mudam; meses de comissão já fechados são preservados)</span></label>`:''}
<label style="flex-basis:100%;flex-direction:row;align-items:center;gap:6px"><input type="checkbox" id="e_s"> Se o valor ${R?'recebido':'pago'} for menor, lançar a diferença como nova parcela, vencendo em <input id="e_sv" type="date" value="${addD(i.venc,30)}"></label>

<p class="k">Para o cliente que adiantou ou pagou diferente: informe a data e o valor realmente ${R?'recebidos':'pagos'}. Deixe a data do pagamento vazia para manter em aberto.</p></div>`}
function saveEd(){try{saveEd0()}catch(e){console.error(e);toast('Não foi possível salvar: '+(e&&e.message||e))}}
function saveEd0(){const i=S.it.find(x=>x.id==ui.ed);if(!i){toast('Lançamento não encontrado. Recarregue a página.');return}const g=k=>$('#'+k).value,v=parseFloat(g('e_v'));
if(!(v>0)||!okd(g('e_e'))){toast('Informe valor maior que zero e vencimento válido.');return}
if(i.t=='r'&&cmBad('e')){toast('Comissionado incompleto: preencha o nome E o percentual (ou apague a linha).');return}
const pago=g('e_p')||null,vr0=g('e_vp'),vp=vr0===''?null:parseFloat(vr0);
const v0=i.venc;Object.assign(i,{desc:g('e_d'),who:nm(g('e_w')),forma:g('e_f'),valor:v,venc:g('e_e'),pago});
if(pago&&vp!=null)i.vp=vp;else delete i.vp;
if(i.t=='r'){i.nfr=g('e_nf').trim();i.coms=cmRead('e')}else Object.assign(i,{pc:g('e_pc'),nf:g('e_nfp'),transp:g('e_tr'),frete:g('e_fr')});
let extra='';
if(pago&&vp!=null&&vp<v-0.005&&$('#e_s').checked){const x=mk(i.t,i.desc,i.who,i.forma,+(v-vp).toFixed(2),g('e_sv')||addD(i.venc,30),null,(i.par?i.par+' ':'')+'saldo');['coms','nfr','pc','nf','transp','frete'].forEach(k=>{if(i[k]!==undefined)x[k]=JSON.parse(JSON.stringify(i[k]))});i.valor=vp;put(x);extra=' + saldo '+fmt(x.valor)}
let rp='';if(i.t=='r'&&$('#e_rep')&&$('#e_rep').checked){const q=cmRep(i,v0);rp=' · comissionados replicados em '+q.n+' parcela(s) seguinte(s)'+(q.k?' ('+q.k+' ignoradas, mês fechado)':'');toast('Comissionados replicados em '+q.n+' parcela(s) seguinte(s)'+(q.k?' · '+q.k+' ignoradas (comissão fechada)':'')+'.','ok')}
wr(i);lg('Editou: '+i.desc+' '+i.par+' · venc '+br(i.venc)+' · '+fmt(i.valor)+(pago?' · pago em '+br(pago)+(i.vp!=null?' ('+fmt(i.vp)+')':''):'')+extra+rp);ui.ed='';render();toast('Lançamento salvo.'+(i.t=='r'?' Comissões: '+(cm(i).map(c=>c.n+' '+String(c.p).replace('.',',')+'%').join(', ')||'nenhuma')+'.':''),'ok')}
const ck=(id,v)=>{v?ui.ck[id]=1:delete ui.ck[id];bar()};
const cmKeys=(i,L)=>(L||cm(i)).map(c=>c.n+(c.r?' · '+c.r:''));
const cmSig=L=>JSON.stringify(L.map(c=>[c.n,c.r||'Vendedor',+c.p]).sort());
const cmLocked=(i,nl)=>{if(!i.pago)return false;const m=ym(i.pago);return [...cmKeys(i),...cmKeys(i,nl)].some(k=>S.fech[k+'|'+m])};
function cmApply(mode,sp,i){const cur=cm(i).map(c=>({n:c.n,r:c.r||'',p:c.p}));
if(mode=='set')return sp.list.map(c=>({...c}));
if(mode=='add'){sp.list.forEach(a=>{const k=cur.findIndex(c=>c.n.toLowerCase()==a.n.toLowerCase()&&(c.r||'Vendedor')==(a.r||'Vendedor'));k<0?cur.push({...a}):cur[k].p=a.p});return cur}
if(mode=='rem')return cur.filter(c=>c.n.toLowerCase()!=sp.n.toLowerCase());
return cur.map(c=>c.n.toLowerCase()==sp.n.toLowerCase()&&(!sp.r||(c.r||'Vendedor')==sp.r)?{...c,p:sp.p}:c)}
function cmTargets(sel,scope){const T={};sel.forEach(i=>T[i.id]=i);
if(scope=='seg'){const th={};sel.forEach(i=>{if(i.who&&(th[i.who]===undefined||i.venc<th[i.who]))th[i.who]=i.venc});S.it.forEach(i=>{if(i.t=='r'&&i.who&&th[i.who]!==undefined&&i.venc>=th[i.who])T[i.id]=i})}
return Object.values(T).sort((a,b)=>a.venc.localeCompare(b.venc))}

function cmSpec(){const mode=$('#cx_m').value;
if(mode=='set'||mode=='add'){const list=cmRead('x');if(mode=='add'&&!list.length)return{err:'Informe o comissionado e o % a adicionar.'};return{mode,sp:{list}}}
const n=$('#cx_nm').value.trim();if(!n)return{err:'Informe o nome do comissionado.'};
if(mode=='rem')return{mode,sp:{n}};
const p=parseFloat($('#cx_pc').value);if(!(p>0))return{err:'Informe o novo % (maior que zero).'};return{mode,sp:{n,p,r:$('#cx_rl').value}}}
function cmPlan(){const s=cmSpec();if(s.err)return{err:s.err};const sel=S.it.filter(i=>ui.ck[i.id]&&i.t=='r');
const T=cmTargets(sel,$('#cx_s').value),P={ok:[],lock:[],same:[],T,s};
T.forEach(i=>{const nl=cmApply(s.mode,s.sp,i);if(cmSig(nl)==cmSig(cm(i)))P.same.push(i);else if(cmLocked(i,nl))P.lock.push(i);else P.ok.push([i,nl])});return P}

function cmRep(i,v0){const nl=i.coms||[];let n=0,k=0;if(!i.who)return{n,k};S.it.forEach(x=>{if(x.t!='r'||x.id==i.id||x.who!=i.who||x.venc<=v0)return;if(cmSig(cm(x))==cmSig(nl))return;if(cmLocked(x,nl)){k++;return}x.coms=nl.map(c=>({...c}));wr(x);n++});return{n,k}}

on?dlg({t:'Data do '+(i.t=='r'?'recebimento':'pagamento'),m:i.desc+' '+i.par+' · '+fmt(i.valor),i:1,ty:'date',d:today,ok:'Confirmar'},v=>{if(!okd(v)){toast('Informe uma data válida.');return}go(v)}):go(null)};

function imp(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{let x;try{x=JSON.parse(r.result);if(!Array.isArray(x.it))throw 0}catch(e){toast('Arquivo de backup inválido.');return}dlg({t:'Importar backup',m:x.it.length+' lançamentos e '+(x.nf||[]).length+' NFs. Os de mesmo código serão substituídos; os demais permanecem.',ok:'Importar'},()=>{merge(x);toast('Backup importado.','ok')})};r.readAsText(f);inp.value=''}
function exp(){const d=JSON.stringify({v:1,em:new Date().toISOString(),it:S.it,fech:S.fech,nf:S.nf,cl:CLS(),cli:S.cli||{}},null,1),fn='backup-bra-financeiro-'+today+'.json';

else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([d],{type:'application/json'}));a.download=fn;a.click();done()}}
function bx(a){const L=S.it.filter(i=>ui.ck[i.id]);if(!L.length)return;

else if(a=='baixavenc'){const D=L.filter(i=>!i.pago);D.forEach(i=>{i.pago=i.venc;wr(i)});fin('Baixa em lote na data do vencimento',D)}

else if(a=='dias'){const k=parseInt($('#b_n').value);if(!k){toast('Informe os dias (negativo para antecipar).');return}L.forEach(i=>{i.venc=addD(i.venc,k);wr(i)});fin('Vencimento deslocado '+k+' dia(s)',L)}
else if(a=='forma'){const f=$('#b_f').value;L.forEach(i=>{i.forma=f;wr(i)});fin('Forma alterada para '+f,L)}

else if(a=='del')dlg({t:'Excluir lançamentos',m:'Excluir '+L.length+' lançamento(s)? Não pode ser desfeito.',ok:'Excluir',dg:1},()=>{L.forEach(i=>rm(i.id));S.it=S.it.filter(i=>!ui.ck[i.id]);fin('Excluiu em lote',L)})}
